[package]
name = "isdayoff"
version = "0.1.0"
edition = "2024"
rust-version = "1.86"
description = "Client for the isdayoff.ru production calendar API: workdays, days off, shortened days and holidays"
license = "MIT OR Apache-2.0"
repository = "https://github.com/demen1n/isdayoff"
documentation = "https://docs.rs/isdayoff"
readme = "README.md"
keywords = ["calendar", "holidays", "workday", "isdayoff", "russia"]
categories = ["api-bindings", "date-and-time"]
# Ship only what is needed to build and document the crate.
include = ["/src/**/*", "/examples/**/*", "/tests/**/*", "/README.md", "/LICENSE-*", "/Cargo.toml"]

[features]
default = ["rustls"]
# TLS backend. Enable one (the API is HTTPS-only).
rustls = ["reqwest/rustls"]
native-tls = ["reqwest/native-tls"]
# Synchronous client `isdayoff::blocking::IsDayOff`.
blocking = ["reqwest/blocking"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
reqwest = { version = "0.13", default-features = false }
thiserror = "2"
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
# For examples: `Local::now()` needs the `clock` feature.
chrono = { version = "0.4", features = ["clock"] }

[package.metadata.docs.rs]
# Build docs.rs documentation with all features, including `blocking`.
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[example]]
name = "blocking"
required-features = ["blocking"]

[lints.rust]
# `docsrs` is only set when building on docs.rs; declare it to avoid a warning.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(docsrs)"] }
